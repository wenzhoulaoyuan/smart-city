<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#03152f">
<title>智慧城市住房展示平台</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:#03152f;color:#fff;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
body{
  background:
    radial-gradient(circle at 20% 0%,rgba(0,184,255,.16),transparent 32%),
    radial-gradient(circle at 90% 15%,rgba(0,88,255,.18),transparent 28%),
    linear-gradient(180deg,#03152f 0%,#062b55 55%,#041b35 100%);
}
button{font:inherit}
.app{width:100%;min-height:100vh;overflow-x:hidden}
.page{display:none;min-height:100vh;padding-bottom:28px}
.page.active{display:block}

/* 顶部 */
.header{
  position:sticky;top:0;z-index:20;
  min-height:64px;padding:15px 16px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(3,21,47,.92);
  border-bottom:1px solid rgba(0,196,255,.4);
  box-shadow:0 0 20px rgba(0,140,255,.25);
  backdrop-filter:blur(12px);
}
.header-title{font-size:20px;font-weight:700;letter-spacing:2px;color:#eafaff;text-align:center}
.header-back{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  border:1px solid rgba(0,205,255,.45);background:rgba(0,92,160,.28);
  color:#c8f5ff;border-radius:10px;padding:7px 11px;font-size:14px
}

/* 首页/列表 */
.hero{
  margin:16px;
  padding:20px 18px;
  border:1px solid rgba(0,196,255,.55);
  border-radius:18px;
  background:linear-gradient(145deg,rgba(0,115,190,.28),rgba(0,45,95,.28));
  box-shadow:inset 0 0 30px rgba(0,150,255,.08),0 8px 28px rgba(0,0,0,.18);
}
.hero-kicker{font-size:13px;color:#55dfff;letter-spacing:1.5px;margin-bottom:8px}
.hero-title{font-size:24px;font-weight:800;letter-spacing:1px}
.hero-sub{font-size:13px;color:#8eb6cf;line-height:1.65;margin-top:8px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hero-stat{padding:10px 6px;background:rgba(3,65,118,.48);border-radius:12px;text-align:center}
.hero-stat strong{display:block;font-size:19px;color:#00e6ff}
.hero-stat span{display:block;font-size:11px;color:#94b8cf;margin-top:3px}

.section-head{display:flex;align-items:end;justify-content:space-between;padding:2px 16px 10px}
.section-head h2{font-size:19px;color:#00d8ff}
.section-head span{font-size:11px;color:#7399b1}

.building-list{padding:0 14px}
.building-card{
  position:relative;
  display:flex;gap:12px;
  padding:12px;
  margin-bottom:12px;
  min-height:142px;
  border:1px solid rgba(0,171,255,.38);
  border-radius:16px;
  background:linear-gradient(135deg,rgba(0,78,140,.33),rgba(3,34,72,.62));
  box-shadow:0 8px 24px rgba(0,0,0,.16),inset 0 0 20px rgba(0,151,255,.05);
}
.building-thumb{
  width:105px;height:118px;flex:0 0 105px;
  border-radius:11px;overflow:hidden;
  border:1px solid rgba(0,213,255,.35);
  background:#08284b;
}
.building-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.building-main{min-width:0;flex:1;display:flex;flex-direction:column}
.building-name{font-size:17px;font-weight:700;color:#fff;margin-bottom:5px}
.building-tag{
  align-self:flex-start;padding:3px 8px;border-radius:999px;
  background:rgba(0,194,255,.12);color:#70e7ff;border:1px solid rgba(0,206,255,.28);
  font-size:10px;margin-bottom:7px
}
.building-meta{font-size:12px;color:#b4cfe0;line-height:1.6}
.building-meta b{color:#dff8ff;font-weight:600}
.building-desc{
  margin-top:4px;font-size:11px;line-height:1.45;color:#7fa5bc;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.view-btn{
  margin-top:auto;align-self:flex-end;
  min-width:68px;padding:7px 12px;border-radius:9px;
  border:1px solid rgba(0,217,255,.55);
  background:linear-gradient(180deg,#048fe0,#006ab4);
  color:#fff;font-size:12px;box-shadow:0 4px 12px rgba(0,150,255,.23)
}
.view-btn:active,.primary-btn:active,.header-back:active{transform:scale(.97)}

.notice{
  margin:14px 16px 0;
  padding:10px 12px;
  border-left:3px solid #00d8ff;
  background:rgba(0,88,150,.16);
  color:#84a9bd;font-size:11px;line-height:1.55
}

/* 详情 */
.detail-wrap{padding:0 14px}
.detail-banner{
  margin-top:14px;border:1px solid rgba(0,195,255,.46);border-radius:17px;
  overflow:hidden;background:#06294c;box-shadow:0 10px 25px rgba(0,0,0,.18)
}
.gallery{
  position:relative;display:flex;overflow-x:auto;gap:0;
  scroll-snap-type:x mandatory;overscroll-behavior-x:contain;
  scrollbar-width:none;touch-action:pan-x;
}
.gallery::-webkit-scrollbar{display:none}
.gallery-slide{
  min-width:100%;height:245px;scroll-snap-align:center;position:relative;background:#061a31
}
.gallery-slide img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.gallery-tip{
  position:absolute;left:12px;bottom:10px;padding:5px 8px;border-radius:8px;
  background:rgba(0,0,0,.45);font-size:10px;color:#eafaff
}
.gallery-count{
  position:absolute;right:12px;top:10px;padding:5px 8px;border-radius:8px;
  background:rgba(0,0,0,.5);font-size:11px;color:#fff
}
.dots{display:flex;justify-content:center;gap:5px;padding:9px;background:rgba(2,25,49,.9)}
.dot{width:6px;height:6px;border-radius:50%;background:#40657d}
.dot.active{width:17px;border-radius:999px;background:#00dfff}
.detail-title-card{
  margin-top:12px;padding:15px;border-radius:15px;
  border:1px solid rgba(0,179,255,.35);
  background:linear-gradient(135deg,rgba(0,77,135,.3),rgba(2,35,73,.55))
}
.detail-title-line{display:flex;justify-content:space-between;gap:10px;align-items:start}
.detail-name{font-size:20px;font-weight:800}
.status{
  flex:0 0 auto;padding:5px 9px;border-radius:999px;
  background:rgba(0,216,151,.13);border:1px solid rgba(0,220,170,.35);
  color:#65efcf;font-size:10px
}
.detail-location{margin-top:7px;font-size:12px;color:#8eb5c8}
.info-card,.data-card{
  margin-top:12px;padding:15px;border-radius:15px;
  border:1px solid rgba(0,160,255,.3);
  background:rgba(1,51,95,.38)
}
.card-title{
  font-size:16px;color:#00d8ff;font-weight:700;padding-left:9px;
  border-left:3px solid #00dfff;margin-bottom:12px
}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.info-item{padding:11px 10px;border-radius:10px;background:rgba(4,58,104,.65)}
.info-item span{display:block;font-size:10px;color:#789fb5;margin-bottom:5px}
.info-item strong{font-size:16px;color:#eafdff}
.summary{font-size:12px;color:#a4c1d0;line-height:1.85}
.summary b{color:#eafaff}
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.data-box{text-align:center;padding:11px 7px;border-radius:10px;background:rgba(4,58,104,.65)}
.data-box strong{display:block;font-size:21px;color:#00eaff}
.data-box span{font-size:10px;color:#7ea8bd}
.primary-btn{
  width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;
  background:linear-gradient(135deg,#00a8ea,#0066c5);color:#fff;
  font-size:14px;font-weight:700;box-shadow:0 8px 20px rgba(0,151,255,.2)
}

/* 弹窗/全屏照片 */
.modal{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.74);align-items:center;justify-content:center;padding:20px
}
.modal.show{display:flex}
.modal-card{
  width:min(92vw,420px);max-height:84vh;overflow:auto;
  background:#05294f;border:1px solid #00c8ff;border-radius:18px;padding:20px;
  box-shadow:0 0 35px rgba(0,180,255,.24)
}
.modal-card h3{font-size:18px;color:#00ddff;margin-bottom:12px}
.modal-card p{font-size:13px;color:#b0cad8;line-height:1.8}
.modal-btn{width:100%;margin-top:15px;padding:12px;border:0;border-radius:11px;background:#057fc9;color:#fff}
.photo-viewer{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.95);align-items:center;justify-content:center
}
.photo-viewer.show{display:flex}
.photo-viewer img{max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain}
.photo-close{
  position:absolute;right:16px;top:15px;z-index:202;
  width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.5);color:#fff;font-size:23px
}
.photo-hint{
  position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
  padding:7px 10px;border-radius:9px;background:rgba(0,0,0,.55);
  color:#d7f8ff;font-size:10px;white-space:nowrap
}

/* 小屏优化 */
@media (max-width:360px){
  .building-thumb{width:92px;flex-basis:92px}
  .building-card{min-height:132px}
  .building-name{font-size:16px}
  .hero-title{font-size:22px}
}
</style>
</head>

<body>
<div class="app">

  <!-- 楼宇房源推介页 -->
  <section id="listPage" class="page active">
    <header class="header">
      <div class="header-title">智慧城市 · 房源资源平台</div>
    </header>

    <div class="hero">
      <div class="hero-kicker">CITY ASSET VISUALIZATION</div>
      <div class="hero-title">楼宇房源推介</div>
      <div class="hero-sub">面向移动端的城市楼宇资源展示与智能推介界面</div>
      <div class="hero-stats">
        <div class="hero-stat"><strong>38</strong><span>在租楼宇</span></div>
        <div class="hero-stat"><strong>126</strong><span>可租房源</span></div>
        <div class="hero-stat"><strong>92%</strong><span>资源匹配度</span></div>
      </div>
    </div>

    <div class="section-head">
      <h2>重点楼宇推荐</h2>
      <span>向下滑动查看更多</span>
    </div>

    <div id="buildingList" class="building-list"></div>

    <div class="notice">
      本页面为智慧城市移动端演示界面。楼宇数据、图片和指标均可在后续演示中替换为实际项目资料。
    </div>
  </section>

  <!-- 楼宇详情页 -->
  <section id="detailPage" class="page">
    <header class="header">
      <button class="header-back" onclick="goBack()">‹ 返回</button>
      <div class="header-title">楼宇资源详情</div>
    </header>

    <main class="detail-wrap">
      <div id="detailContent"></div>
    </main>
  </section>

</div>

<!-- 智慧分析弹窗 -->
<div id="reportModal" class="modal" onclick="closeReport(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <h3>智慧城市分析报告</h3>
    <p id="reportText"></p>
    <button class="modal-btn" onclick="hideReport()">关闭</button>
  </div>
</div>

<!-- 照片全屏查看 -->
<div id="photoViewer" class="photo-viewer">
  <button class="photo-close" onclick="closePhoto()">×</button>
  <img id="fullPhoto" src="" alt="楼宇照片">
  <div class="photo-hint">点击 × 返回楼宇详情</div>
</div>

<script>
const buildings = [
  {
    id: 1,
    name: "滨江智慧金融中心",
    tag: "重点推荐",
    thumb: "image/1.png",
    photos: ["image/1.png","image/2.png","image/3.png","image/4.png"],
    area: "86,500㎡",
    office: "62,300㎡",
    position: "滨江智慧城区核心区",
    location: "滨江大道与科技路交汇处",
    overview: "项目位于城市核心商务板块，周边金融、商业和交通资源成熟，适合总部办公、企业研发及专业服务机构入驻。",
    rent: "2.8–3.6 元/㎡·天",
    status: "可出租",
    heat: "92%",
    traffic: "88",
    people: "12.6万",
    business: "95",
    report: "该楼宇位于城市重点发展区域，交通和商业配套成熟，区域租赁需求指数较高，适合中大型企业办公及总部型机构布局。"
  },
  {
    id: 2,
    name: "智谷科创大厦",
    tag: "科创载体",
    thumb: "image/2.png",
    photos: ["image/2.png","image/3.png","image/4.png","image/1.png"],
    area: "71,200㎡",
    office: "48,900㎡",
    position: "高新技术产业园区",
    location: "科创大道88号",
    overview: "面向科技研发、数字经济及创新型企业打造的现代化办公载体，周边创新资源和产业服务体系完善。",
    rent: "2.5–3.2 元/㎡·天",
    status: "部分出租",
    heat: "89%",
    traffic: "91",
    people: "9.8万",
    business: "90",
    report: "该项目产业集聚度较高，周边科技企业和创新主体密集，适合研发办公、企业孵化及数字经济类项目。"
  },
  {
    id: 3,
    name: "中央商务区A座",
    tag: "商务办公",
    thumb: "image/3.png",
    photos: ["image/3.png","image/4.png","image/1.png","image/2.png"],
    area: "105,800㎡",
    office: "75,600㎡",
    position: "中央商务区",
    location: "中央商务环路12号",
    overview: "高品质商务办公项目，毗邻轨道交通站点及城市核心商圈，适合金融、咨询、法律及大型企业办公。",
    rent: "3.2–4.2 元/㎡·天",
    status: "可出租",
    heat: "95%",
    traffic: "96",
    people: "15.2万",
    business: "98",
    report: "项目具备较强商务集聚能力，城市交通可达性和商业配套指数领先，适合对办公形象、交通和客户接待有较高要求的企业。"
  },
  {
    id: 4,
    name: "城市创意产业园",
    tag: "产业园区",
    thumb: "image/4.png",
    photos: ["image/4.png","image/1.png","image/2.png","image/3.png"],
    area: "58,600㎡",
    office: "39,700㎡",
    position: "城市更新示范片区",
    location: "创意路66号",
    overview: "融合办公、展示、文化创意与配套服务的复合型产业园区，空间灵活，适合新媒体、设计、文化和数字创意企业。",
    rent: "1.8–2.6 元/㎡·天",
    status: "可出租",
    heat: "86%",
    traffic: "83",
    people: "7.5万",
    business: "87",
    report: "项目空间灵活、产业氛围突出，适合创意类和轻资产企业，具有较好的产业协同及城市更新示范价值。"
  }
];

let currentBuilding = buildings[0];
let detailScrollX = 0;

function renderBuildingList(){
  const list = document.getElementById("buildingList");
  list.innerHTML = buildings.map(b => `
    <article class="building-card">
      <div class="building-thumb">
        <img src="${b.thumb}" alt="${b.name}" onerror="this.style.opacity='.35'">
      </div>
      <div class="building-main">
        <div class="building-name">${b.name}</div>
        <div class="building-tag">${b.tag}</div>
        <div class="building-meta">
          总建筑面积：<b>${b.area}</b><br>
          办公面积：<b>${b.office}</b><br>
          项目位置：<b>${b.position}</b>
        </div>
        <div class="building-desc">${b.overview}</div>
        <button class="view-btn" onclick="openBuilding(${b.id})">查看</button>
      </div>
    </article>
  `).join("");
}

function openBuilding(id){
  currentBuilding = buildings.find(b => b.id === id) || buildings[0];
  document.getElementById("listPage").classList.remove("active");
  document.getElementById("detailPage").classList.add("active");
  renderDetail(currentBuilding);
  window.scrollTo({top:0,behavior:"instant"});
}

function renderDetail(b){
  const detail = document.getElementById("detailContent");
  detail.innerHTML = `
    <div class="detail-banner">
      <div class="gallery" id="detailGallery">
        ${b.photos.map((src,i)=>`
          <div class="gallery-slide">
            <img src="${src}" alt="${b.name}照片${i+1}" onclick="openPhoto('${src}')"
                 onerror="this.style.opacity='.25'">
            <div class="gallery-count">${i+1} / ${b.photos.length}</div>
            <div class="gallery-tip">点击照片全屏查看 · 左右滑动切换</div>
          </div>
        `).join("")}
      </div>
      <div class="dots" id="galleryDots">
        ${b.photos.map((_,i)=>`<span class="dot ${i===0?'active':''}"></span>`).join("")}
      </div>
    </div>

    <div class="detail-title-card">
      <div class="detail-title-line">
        <div class="detail-name">${b.name}</div>
        <div class="status">${b.status}</div>
      </div>
      <div class="detail-location">📍 ${b.location}</div>
    </div>

    <div class="info-card">
      <div class="card-title">楼宇基本信息</div>
      <div class="info-grid">
        <div class="info-item"><span>总建筑面积</span><strong>${b.area}</strong></div>
        <div class="info-item"><span>办公面积</span><strong>${b.office}</strong></div>
        <div class="info-item"><span>项目位置</span><strong style="font-size:13px">${b.position}</strong></div>
        <div class="info-item"><span>参考租金</span><strong style="font-size:14px">${b.rent}</strong></div>
      </div>
    </div>

    <div class="info-card">
      <div class="card-title">项目概况</div>
      <div class="summary">${b.overview}</div>
    </div>

    <div class="data-card">
      <div class="card-title">智慧城市数据</div>
      <div class="data-grid">
        <div class="data-box"><strong>${b.heat}</strong><span>区域热度</span></div>
        <div class="data-box"><strong>${b.traffic}</strong><span>交通指数</span></div>
        <div class="data-box"><strong>${b.people}</strong><span>周边人口</span></div>
        <div class="data-box"><strong>${b.business}</strong><span>商业指数</span></div>
      </div>
      <button class="primary-btn" onclick="showReport()">查看智慧分析报告</button>
    </div>
  `;

  const gallery = document.getElementById("detailGallery");
  const dots = [...document.querySelectorAll("#galleryDots .dot")];

  gallery.addEventListener("scroll",()=>{
    const index = Math.min(
      b.photos.length-1,
      Math.max(0,Math.round(gallery.scrollLeft / gallery.clientWidth))
    );
    dots.forEach((d,i)=>d.classList.toggle("active",i===index));
  },{passive:true});
}

function goBack(){
  document.getElementById("detailPage").classList.remove("active");
  document.getElementById("listPage").classList.add("active");
  window.scrollTo({top:0,behavior:"instant"});
}

function showReport(){
  document.getElementById("reportText").textContent = currentBuilding.report;
  document.getElementById("reportModal").classList.add("show");
}
function hideReport(){
  document.getElementById("reportModal").classList.remove("show");
}
function closeReport(e){
  if(e.target.id === "reportModal") hideReport();
}

function openPhoto(src){
  document.getElementById("fullPhoto").src = src;
  document.getElementById("photoViewer").classList.add("show");
}
function closePhoto(){
  document.getElementById("photoViewer").classList.remove("show");
  document.getElementById("fullPhoto").src = "";
}

/* 浏览器返回键：详情页返回列表，照片全屏先关闭 */
window.addEventListener("popstate",()=>{
  if(document.getElementById("photoViewer").classList.contains("show")){
    closePhoto(); return;
  }
  if(document.getElementById("detailPage").classList.contains("active")){
    goBack();
  }
});

renderBuildingList();
</script>
</body>
</html>
